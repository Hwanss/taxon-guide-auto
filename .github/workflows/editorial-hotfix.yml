name: TaxonGuru Editorial Hotfix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['EDITORIAL_HOTFIX_TRIGGER.md']
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile adsense_editorial_hotfix.py
      - name: Verify selected WordPress copy edits
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ADSENSE_HOTFIX_APPLY: 'false'
        run: python adsense_editorial_hotfix.py
      - name: Preserve before-edits original copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-content-hotfix-${{ github.run_number }}
          path: audit_output/content_hotfix/
          retention-days: 30
          if-no-files-found: warn
