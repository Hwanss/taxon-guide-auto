name: Create / Refresh Editorial Pages v6

on:
  workflow_dispatch:

jobs:
  create-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish required editorial pages
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SITE_PAGES_STATUS: publish
          SITE_PAGES_FORCE_UPDATE: 'true'
          REQUEST_TIMEOUT: '45'
        run: python setup_site_pages.py
