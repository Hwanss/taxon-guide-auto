name: TaxonGuru Victoria 775 Evidence Fix (Guarded)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VICTORIA_EVIDENCE_FIX_TRIGGER.md']
jobs:
  preview_or_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile adsense_victoria_evidence_fix_20261111.py
      - name: Guard and preview reference alignment, without publishing
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VICTORIA_EVIDENCE_APPLY: 'false'
        run: python adsense_victoria_evidence_fix_20261111.py
      - name: Preserve original WordPress HTML and review preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victoria-evidence-fix-${{ github.run_number }}
          path: audit_output/victoria_evidence_20261111/
          retention-days: 90
          if-no-files-found: warn
