name: TaxonGuru Mobile Floating Share UX Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['MOBILE_UX_FIX_TRIGGER.md']
jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile adsense_mobile_floating_fix_20261107.py
      - name: Safely preview or insert mobile reading CSS widget
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MOBILE_FIX_APPLY: 'false'
        run: python adsense_mobile_floating_fix_20261107.py
      - name: Archive prior WordPress widgets and modified CSS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-mobile-ux-rollback-${{ github.run_number }}
          path: audit_output/mobile_floating_fix/
          retention-days: 90
          if-no-files-found: warn
