name: TaxonGuru B-priority Eight Scientific Editorial
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['B8_EDITORIAL_TRIGGER.md']
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile adsense_editorial_b8.py
      - name: Validate exact-source evidence changes for eight articles
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EDITORIAL_B8_APPLY: 'true'
        run: python adsense_editorial_b8.py
      - name: Keep all originals and results (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-b8-evidence-originals-${{ github.run_number }}
          path: audit_output/editorial_b8/
          retention-days: 90
          if-no-files-found: warn
