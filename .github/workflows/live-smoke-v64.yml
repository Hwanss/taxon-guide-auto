name: TaxonGuru v6.4 Live Dry Run

on:
  push:
    branches:
      - chatgpt/adsense-v6.4-auto-publish
  workflow_dispatch:

jobs:
  live-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: v6.4 live dry-run
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: 'taxonguru'
          FORCE_IPV4: 'true'
          REQUEST_TIMEOUT: '45'
          AUDIT_OUTPUT_DIR: 'audit_output'
          AUTO_PUBLISH_ENABLED: 'true'
          AUTO_PUBLISH_DRY_RUN: 'true'
          AUTO_PUBLISH_BATCH_SIZE: '4'
          AUTO_PUBLISH_MIN_KO_SCORE: '98'
          AUTO_PUBLISH_MIN_EN_SCORE: '96'
          AUTO_PUBLISH_MIN_SOURCES: '4'
          AUTO_PUBLISH_MIN_KO_CHARS: '2600'
          AUTO_PUBLISH_MIN_EN_WORDS: '950'
          AUTO_PUBLISH_REQUIRE_IMAGES: 'true'
          AUTO_PUBLISH_CHECK_SOURCE_LINKS: 'true'
          AUTO_REWRITE_FAILED_LEGACY: 'true'
          MAX_LEGACY_REWRITE_ATTEMPTS: '3'
        run: python adsense_auto_publish_v64.py --dry-run

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-v64-live-dry-run
          path: audit_output/
          if-no-files-found: ignore
          retention-days: 7
