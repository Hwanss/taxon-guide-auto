name: TaxonGuru Auto Publish v6.4 Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  v64-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Compile v6.4
        run: |
          python -m py_compile adsense_auto_publish_v64.py

      - name: Auto publish self-test
        run: python adsense_auto_publish_v64.py --self-test
