name: TaxonGuru Sourced Reader Guide & Navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['READER_GUIDE_TRIGGER.md']
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile adsense_reader_guide.py
      - name: Read-only guide and site navigation preflight
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          READER_GUIDE_APPLY: 'true'
        run: python adsense_reader_guide.py
      - name: Archive pre-change navigation and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-reader-guide-${{ github.run_number }}
          path: audit_output/reader_guide/
          retention-days: 30
          if-no-files-found: warn
