name: TaxonGuru Site Purpose & Tagline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['SITE_PURPOSE_TRIGGER.md']
jobs:
  tagline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile adsense_site_purpose.py
      - name: Apply site description without altering URL
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SITE_PURPOSE_APPLY: 'false'
        run: python adsense_site_purpose.py
      - name: Archive original settings and check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-site-purpose-${{ github.run_number }}
          path: audit_output/site_purpose/
          retention-days: 30
          if-no-files-found: warn
