name: TaxonGuru AdSense Recovery v6.1

concurrency:
  group: taxonguru-adsense-recovery
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force_phase:
        description: '실행 단계'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - cleanup
          - readiness
          - status_only
      legacy_batch_size:
        description: '기존 공개 글 회당 감사 건수'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
  schedule:
    # KST 03:17, 09:17, 15:17, 21:17
    # 복구모드에서는 신규 글을 만들거나 자동 발행하지 않습니다.
    # 기존 공개 글 감사 → 문제 글 초안 전환 → 재작성 → 사람 검수 대기만 진행합니다.
    - cron: '17 18,0,6,12 * * *'

jobs:
  adsense-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import importlib.metadata as m; print('google-genai=' + m.version('google-genai'))"

      - name: Run AdSense recovery controller
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

          SHEET_NAME: 'taxonguru'
          CONTROL_SHEET_NAME: '파이프라인상태'
          LEGACY_TARGET_STATUS: '완료'
          LEGACY_BATCH_SIZE: ${{ github.event.inputs.legacy_batch_size || '1' }}
          FORCE_PHASE: ${{ github.event.inputs.force_phase || 'auto' }}
          MAX_LEGACY_REWRITE_ATTEMPTS: '3'

          # AdSense recovery safety gates
          ADSENSE_RECOVERY_MODE: 'true'
          MANUAL_REVIEW_REQUIRED: 'true'
          AUTO_SCHEDULE: 'false'
          DRAFT_ON_REVIEW_FAILURE: 'true'

          SCHEDULE_TIMEZONE: 'Asia/Seoul'
          FORCE_IPV4: 'true'
          WP_CONNECT_RETRIES: '5'
          WP_CONNECT_RETRY_DELAY: '3'
          REQUEST_TIMEOUT: '45'

          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '88'
          MIN_KOREAN_CHARS: '2600'
          MIN_ENGLISH_WORDS: '950'
          MIN_CITATION_MARKERS: '4'
          BODY_IMAGE_MAX_WIDTH: '720'
          BODY_IMAGE_MAX_HEIGHT: '520'
          ENABLE_ENGLISH: 'true'

          ALLOW_AI_FEATURED_IMAGE: 'true'
          PREFER_AI_FEATURED_IMAGE: 'true'
          GENERATE_AI_BODY_IMAGES: 'true'
          MIN_BODY_IMAGES: '2'

          AUTO_CLEANUP_MODE: 'true'
          AUTO_FAIL_CLOSED_DRAFT: 'true'
          QUEUE_GRADE_D_FOR_REWRITE: 'true'
          AUDIT_OUTPUT_DIR: 'audit_output'
        run: python pipeline_controller.py

      - name: Upload audit/readiness reports and backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-adsense-recovery-${{ github.run_number }}
          path: audit_output/
          if-no-files-found: ignore
          retention-days: 30
