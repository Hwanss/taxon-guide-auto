name: TaxonGuru Content Audit & Repair

concurrency:
  group: taxonguru-content-audit-repair
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        required: true
        default: 'report_only'
        type: choice
        options:
          - report_only
          - safe_fix
          - rewrite_recent
      batch_size:
        description: '최근 게시물 처리 건수(처음에는 1~3 권장)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      include_already_audited:
        description: '이미 감사한 게시물도 다시 처리'
        required: true
        default: false
        type: boolean
      create_english:
        description: 'rewrite_recent에서 별도 영어 글도 작성'
        required: true
        default: true
        type: boolean
      draft_grade_d:
        description: 'D등급을 자동 초안 전환(처음에는 끄기 권장)'
        required: true
        default: false
        type: boolean

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import importlib.metadata as m; print('google-genai=' + m.version('google-genai'))"

      - name: Audit and optionally repair recent posts
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_BATCH_SIZE: ${{ inputs.batch_size }}
          INCLUDE_ALREADY_AUDITED: ${{ inputs.include_already_audited }}
          AUDIT_CREATE_ENGLISH: ${{ inputs.create_english }}
          AUDIT_DRAFT_GRADE_D: ${{ inputs.draft_grade_d }}
          AUDIT_INCLUDE_ENGLISH_POSTS: 'false'

          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '85'
          BODY_IMAGE_MAX_WIDTH: '720'
          BODY_IMAGE_MAX_HEIGHT: '520'
          AUDIT_OUTPUT_DIR: 'audit_output'
        run: python audit_existing_posts.py

      - name: Upload reports and original backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-content-audit-${{ github.run_number }}
          path: audit_output/
          if-no-files-found: warn
          retention-days: 30
