name: TaxonGuru AdSense Recovery v6.3

concurrency:
  group: taxonguru-adsense-recovery
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force_phase:
        description: '실행 단계'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - cleanup
          - readiness
          - status_only
      legacy_batch_size:
        description: '자동 정리 회당 최대 처리 건수'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
  schedule:
    # KST 03:17, 09:17, 15:17, 21:17
    # 신규 자동발행은 중지합니다.
    # 기존 v6.2 정리 + 공개 글 2차 하드블로커 검사 + 사람 최종검수 큐를 자동 운영합니다.
    - cron: '17 18,0,6,12 * * *'

jobs:
  adsense-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import importlib.metadata as m; print('google-genai=' + m.version('google-genai'))"

      - name: Run AdSense recovery v6.3
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

          SHEET_NAME: 'taxonguru'
          CONTROL_SHEET_NAME: '파이프라인상태'
          LEGACY_TARGET_STATUS: '완료'
          LEGACY_BATCH_SIZE: '1'
          AUTO_CLEANUP_ITEMS_PER_RUN: ${{ github.event.inputs.legacy_batch_size || '2' }}
          AUTO_CLEANUP_MAX_MINUTES: '50'
          SHEET_AUTO_REPAIR: 'true'
          AUTO_READINESS_WHEN_CLEAN: 'false'
          FORCE_PHASE: ${{ github.event.inputs.force_phase || 'auto' }}
          MAX_LEGACY_REWRITE_ATTEMPTS: '3'

          # AdSense recovery safety gates
          ADSENSE_RECOVERY_MODE: 'true'
          MANUAL_REVIEW_REQUIRED: 'true'
          AUTO_SCHEDULE: 'false'
          DRAFT_ON_REVIEW_FAILURE: 'true'

          # v6.3 public-content guard
          PUBLIC_GUARD_ENABLED: 'true'
          PUBLIC_GUARD_BATCH_SIZE: '2'
          PUBLIC_GUARD_MANUAL_QUEUE_SOFT_LIMIT: '24'
          PUBLIC_GUARD_REQUIRE_MANUAL_CURATION: 'true'
          PUBLIC_GUARD_DRAFT_HARD_BLOCKERS: 'true'

          SCHEDULE_TIMEZONE: 'Asia/Seoul'
          FORCE_IPV4: 'true'
          WP_CONNECT_RETRIES: '5'
          WP_CONNECT_RETRY_DELAY: '3'
          REQUEST_TIMEOUT: '45'

          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '88'
          MIN_KOREAN_CHARS: '2600'
          MIN_ENGLISH_WORDS: '950'
          MIN_CITATION_MARKERS: '4'
          BODY_IMAGE_MAX_WIDTH: '720'
          BODY_IMAGE_MAX_HEIGHT: '520'
          ENABLE_ENGLISH: 'true'

          ALLOW_AI_FEATURED_IMAGE: 'true'
          PREFER_AI_FEATURED_IMAGE: 'true'
          GENERATE_AI_BODY_IMAGES: 'true'
          MIN_BODY_IMAGES: '2'

          AUTO_CLEANUP_MODE: 'true'
          AUTO_FAIL_CLOSED_DRAFT: 'true'
          QUEUE_GRADE_D_FOR_REWRITE: 'true'
          AUDIT_OUTPUT_DIR: 'audit_output'
        run: python adsense_recovery_entrypoint.py

      - name: Upload audit/readiness reports and backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-adsense-recovery-${{ github.run_number }}
          path: audit_output/
          if-no-files-found: ignore
          retention-days: 30
