name: TaxonGuru v6.3 Live Readiness Smoke

on:
  push:
    branches:
      - chatgpt/adsense-v6.3-guard

jobs:
  live-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
      - name: Live readiness smoke test
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: 'taxonguru'
          FORCE_IPV4: 'true'
          REQUEST_TIMEOUT: '45'
          AUDIT_OUTPUT_DIR: 'audit_output'
        run: python adsense_readiness_v63.py
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonguru-v63-live-smoke
          path: audit_output/
          if-no-files-found: ignore
          retention-days: 7
