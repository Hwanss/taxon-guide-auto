name: TaxonGuru Bilingual Story Auto-Publish

concurrency:
  group: taxon-blog-scheduled-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # 매일 06:23 KST 실행. GitHub cron은 UTC이므로 전날 21:23 UTC입니다.
    # 실행 시 주제 1건으로 한국어·영어 글을 각각 작성·검수하고 KO 09:30, EN 18:30에 예약합니다.
    - cron: '23 21 * * *'

jobs:
  scheduled-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import importlib.metadata as m; print('google-genai=' + m.version('google-genai'))"

      - name: Create and schedule Korean and English articles
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

          AUTO_SCHEDULE: 'true'
          ENABLE_ENGLISH: 'true'
          MULTILINGUAL_BACKEND: 'taxonguru_bridge'
          DRAFT_ON_REVIEW_FAILURE: 'true'
          ALLOW_AI_FEATURED_IMAGE: 'false'

          SCHEDULE_TIMEZONE: 'Asia/Seoul'
          PUBLISH_HOUR: '9'
          PUBLISH_MINUTE: '30'
          ENGLISH_PUBLISH_HOUR: '18'
          ENGLISH_PUBLISH_MINUTE: '30'
          SCHEDULE_AFTER_DAYS: '1'
          SCHEDULE_INTERVAL_DAYS: '1'
          MIN_SCHEDULE_LEAD_MINUTES: '30'
          MAX_SCHEDULE_LOOKAHEAD_DAYS: '120'

          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '85'
          MIN_KOREAN_CHARS: '2200'
          MIN_ENGLISH_WORDS: '850'
          MIN_CITATION_MARKERS: '4'
        run: python main.py
