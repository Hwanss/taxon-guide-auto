name: TaxonGuru Bilingual Story Auto-Publish (PAUSED)

# 기존 콘텐츠 정리 기간에는 자동 cron을 제거했습니다.
# 다시 시작할 때만 Actions 화면에서 'resume_run'을 체크하고 수동 실행하세요.
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: '신규 글 작성을 정말 실행합니다'
        required: true
        default: false
        type: boolean

jobs:
  paused-notice:
    if: ${{ !inputs.resume_run }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "신규 한·영 자동발행은 일시 중지 상태입니다. 콘텐츠 감사 Action을 사용하세요."

  manual-publisher:
    if: ${{ inputs.resume_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run one new bilingual article manually
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          AUTO_SCHEDULE: 'true'
          ENABLE_ENGLISH: 'true'
          MULTILINGUAL_BACKEND: 'taxonguru_bridge'
          BRIDGE_PREFLIGHT_STRICT: 'false'
          DRAFT_ON_REVIEW_FAILURE: 'true'
          ALLOW_AI_FEATURED_IMAGE: 'true'
          PREFER_AI_FEATURED_IMAGE: 'true'
          GENERATE_AI_BODY_IMAGES: 'true'
          MIN_BODY_IMAGES: '2'
          BODY_IMAGE_MAX_WIDTH: '720'
          BODY_IMAGE_MAX_HEIGHT: '520'
          SCHEDULE_TIMEZONE: 'Asia/Seoul'
          PUBLISH_HOUR: '9'
          PUBLISH_MINUTE: '30'
          ENGLISH_PUBLISH_HOUR: '18'
          ENGLISH_PUBLISH_MINUTE: '30'
          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '85'
        run: python main.py
