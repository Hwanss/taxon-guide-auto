name: TaxonGuru Bilingual Story Auto-Publish

concurrency:
  group: taxon-blog-scheduled-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # 매일 06:23 KST 실행. GitHub cron은 UTC이므로 전날 21:23 UTC입니다.
    # 실행 시 주제 1건으로 한국어·영어 글을 각각 작성·검수하고 KO 09:30, EN 18:30에 예약합니다.
    - cron: '23 21 * * *'

jobs:
  scheduled-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import importlib.metadata as m; print('google-genai=' + m.version('google-genai'))"

      - name: Create and schedule Korean and English articles
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

          AUTO_SCHEDULE: 'true'
          ENABLE_ENGLISH: 'true'
          MULTILINGUAL_BACKEND: 'taxonguru_bridge'
          # status 경로가 보안·캐시 계층에서 일시 차단되어도 최종 메타 연결로 재확인합니다.
          BRIDGE_PREFLIGHT_STRICT: 'false'
          BRIDGE_CHECK_RETRIES: '3'
          BRIDGE_RETRY_DELAY_SECONDS: '2'
          DRAFT_ON_REVIEW_FAILURE: 'true'
          ALLOW_AI_FEATURED_IMAGE: 'true'
          PREFER_AI_FEATURED_IMAGE: 'true'
          GENERATE_AI_BODY_IMAGES: 'true'
          ALLOW_HISTORICAL_BODY_IMAGES: 'false'
          MIN_BODY_IMAGES: '2'
          BODY_IMAGE_MAX_WIDTH: '720'
          BODY_IMAGE_MAX_HEIGHT: '520'
          AI_IMAGE_QUALITY: 'medium'

          SCHEDULE_TIMEZONE: 'Asia/Seoul'
          PUBLISH_HOUR: '9'
          PUBLISH_MINUTE: '30'
          ENGLISH_PUBLISH_HOUR: '18'
          ENGLISH_PUBLISH_MINUTE: '30'
          SCHEDULE_AFTER_DAYS: '1'
          SCHEDULE_INTERVAL_DAYS: '1'
          MIN_SCHEDULE_LEAD_MINUTES: '30'
          MAX_SCHEDULE_LOOKAHEAD_DAYS: '120'

          MIN_SOURCE_COUNT: '4'
          MIN_QUALITY_SCORE: '85'
          MIN_KOREAN_CHARS: '2200'
          MIN_ENGLISH_WORDS: '850'
          MIN_CITATION_MARKERS: '4'

          MAX_STRUCTURED_ATTEMPTS: '3'
          MAX_TEXT_ATTEMPTS: '3'
          MAX_REWRITE_ROUNDS: '2'
          GEMINI_RESEARCH_MAX_OUTPUT_TOKENS: '8192'
          GEMINI_ARTICLE_MAX_OUTPUT_TOKENS: '12288'
          GEMINI_METADATA_MAX_OUTPUT_TOKENS: '2048'
          GEMINI_REVIEW_MAX_OUTPUT_TOKENS: '4096'
        run: python main.py
